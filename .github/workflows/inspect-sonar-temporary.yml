name: Inspect prior check annotations

on:
  pull_request:

permissions:
  checks: read

jobs:
  annotations:
    if: github.event.pull_request.number == 13
    runs-on: ubuntu-24.04
    steps:
      - name: Read previous analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/check-runs/133536794416/annotations" \
            --jq '.[] | {path, start_line, end_line, title, message}'
