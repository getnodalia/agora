[package]
name = "agora-desktop"
description = "Ágora's native desktop client, drawn in the Nodalia Design Language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "agora"
path = "src/main.rs"

[dependencies]
agora-core.workspace = true
agora-protocol.workspace = true
agora-client.workspace = true
agora-e2e.workspace = true
eframe.workspace = true
egui.workspace = true
nodalia-theme.workspace = true
nodalia-update = { git = "https://github.com/getnodalia/nodalia-design", rev = "f71ade677551928eb48467f4c67d96e42267e1f3", features = ["egui"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
base64.workspace = true
chrono.workspace = true
png.workspace = true
sys-locale = "0.3"
qrcode = { version = "0.14", default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.19"

[lints]
workspace = true
