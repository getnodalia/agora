[package]
name = "agora-desktop"
description = "Ágora's native desktop client, drawn in the Nodalia Design Language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "agora"
path = "src/main.rs"

[dependencies]
agora-core.workspace = true
agora-protocol.workspace = true
agora-client.workspace = true
agora-e2e.workspace = true
eframe.workspace = true
egui.workspace = true
nodalia-theme.workspace = true
nodalia-update = { git = "https://github.com/getnodalia/nodalia-design", rev = "114848a2ff1a7c29c9a5432fb12e955fbe0aeef2", features = ["egui"] }
tokio = { workspace = true, features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
base64.workspace = true
chrono.workspace = true
png.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg"] }
sys-locale = "0.3"
rfd = "0.17"
cpal = "0.16"
nokhwa = { version = "0.10", features = ["input-native"] }
qrcode = { version = "0.14", default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.19"
# The global menu (com.canonical.dbusmenu), on the zbus the portal file dialogs already use.
zbus = "5.19"

[lints]
workspace = true
